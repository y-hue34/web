services:
  web:
    image: codyssey-web:1.0
    container_name: codyssey-compose-web-multi
    ports:
      - "8084:80"
    depends_on:
      - helper
    environment:
      APP_ENV: multi
  helper:
    image: busybox:1.36
    container_name: codyssey-compose-helper
    command: ["sh", "-c", "mkdir -p /www && echo helper-ok > /www/index.html && httpd -f -p 8080 -h /www"]
    expose:
      - "8080"
